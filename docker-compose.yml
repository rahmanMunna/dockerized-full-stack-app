services:
  db:
    image: postgres:17-alpine
    container_name: pg-local
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5000:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:                 # ← new
      - db-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend-local
    restart: unless-stopped
    environment:
      - PORT=3001
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - CACHE_TTL_SECONDS=60
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy  
    networks:                 # ← new
      - db-net

  redis:
    image: redis:8-alpine
    container_name: redis-local
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - db-net
 
  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight-local
    restart: unless-stopped
    ports:
      - "5540:5540"
    volumes:
      - redisinsightdata:/data
    networks:
      - db-net
    depends_on:
      redis:
        condition: service_healthy


volumes:
  pgdata:
  redisdata:
  redisinsightdata:

networks:                     # ← new (top level, same indentation as volumes)
  db-net:
    name: db-net
    driver: bridge
